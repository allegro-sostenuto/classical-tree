<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Music Composition Tree</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/book.ico" type="image/x-icon">
</head>

<body>

  <h1>Classical Music Tree</h1>

  <!-- Priority Tabs for sorting will be dynamically generated -->
  <ul id="priorityTabs"></ul>

  <button id="applyTabs">Apply Priority</button>
  <button id="expandCollapseAll">Expand All</button>

  <!-- Dropdown Filters Container for categories like Genre, Instrumentation -->
  <div id="filterContainer"></div>

  <!-- Music Tree will be rendered here -->
  <ul id="musicTree"></ul>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
  <script src="js/tree.js" defer></script>

</body>

</html>
