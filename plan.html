<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Music Composition Tree</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <h1>Classical Music Tree</h1>

  <ul id="priorityTabs">
    <li data-field="composer"><span class="handle">≡</span>Composer</li>
    <li data-field="year"><span class="handle">≡</span>Year</li>
    <li data-field="genre"><span class="handle">≡</span>Genre</li>
    <li data-field="instrumentation"><span class="handle">≡</span>Instrumentation</li>
  </ul>  

  <button id="applyTabs">Apply Priority</button>

  <ul id="musicTree"></ul>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
  <script src="js/tree.js" defer></script>
</body>
</html>
